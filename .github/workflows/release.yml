name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: |
                  npm ci

            - name: Run full check
              run: npm run check

            - name: Stage and validate release assets
              run: npm run stage:release -- "${GITHUB_REF_NAME}"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      release-assets/main.js
                      release-assets/manifest.json
                      release-assets/styles.css
                      release-assets/SHA256SUMS

            - name: Publish release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  assets=(release-assets/main.js release-assets/manifest.json release-assets/styles.css release-assets/SHA256SUMS)
                  prerelease_args=()
                  if [[ "$tag" == *-* ]]; then
                      prerelease_args+=(--prerelease)
                  else
                      prerelease_args+=(--prerelease=false)
                  fi

                  if gh release view "$tag" >/dev/null 2>&1; then
                      gh release upload "$tag" "${assets[@]}" --clobber
                      gh release edit "$tag" "${prerelease_args[@]}"
                  else
                      notes_args=(--notes-file RELEASE_NOTES.md)
                      if [[ "$tag" == *-* ]]; then
                          notes_args=(--generate-notes)
                      fi
                      gh release create "$tag" \
                        --title="DetailSearch Linker $tag" \
                        "${notes_args[@]}" \
                        "${prerelease_args[@]}" \
                        "${assets[@]}"
                  fi
